# ECCO Clustering Toolbox — conda environment (share via Anaconda.org or `conda env export`).
#
# Create:
#   conda env create -f environment.yml
#   conda activate ECCO_env
#
# Update after editing this file:
#   conda env update -f environment.yml --prune
#
# Python: 3.11–3.14 (conda-forge). If 3.14 is not available yet on your channel, change the
# python line below to e.g. `python=3.12` or `python=3.11`.
#
name: ECCO_env
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.15
  - pip
  # Lower bounds aligned with requirements.txt
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.8
  - seaborn>=0.13
  - scikit-learn>=1.3
  - biopython>=1.83
  - pillow>=10
  - openpyxl>=3.1
  - xlrd>=2.0
  - xlsxwriter>=3.1
  - selenium>=4.15
  - tqdm>=4.65
  - networkx>=3.2
  - gseapy>=1.1
  - pydeseq2>=0.4
  # PyPI-only / maintained fork of legacy fpdf
  - pip:
      - fpdf2>=2.7.0
      - mplcursors>=0.5
